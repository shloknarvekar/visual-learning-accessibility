[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-learning-api"
version = "0.1.0"
description = "API and AI pipeline for the visual-first learning platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "google-genai>=2.23,<3",
  "httpx>=0.27",
  "pymupdf>=1.28,<2",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not live'"
markers = [
  "live: calls real external services such as the Gemini API; opt in with `pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
